let order = [], pos = -1, ticking = null, remaining = 0;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function newRound(){ order = shuffle([...Array(DECK.length).keys()]); pos = -1; }

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function beep(times){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<times;i++){
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(.3, ctx.currentTime + i*.35);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + i*.35 + .3);
      o.start(ctx.currentTime + i*.35); o.stop(ctx.currentTime + i*.35 + .3);
    }
  }catch(e){}
}

function stopTimer(){ if(ticking){ clearInterval(ticking); ticking = null; } }

function render(){
  stopTimer();
  const c = DECK[order[pos]];
  const front = document.getElementById('front');
  const back  = document.getElementById('back');
  document.getElementById('card').classList.remove('flipped');

  if(c.q){
    front.className = 'face front';
    front.innerHTML = `
      <div class="badge-row"><span class="badge q">Question + Action</span><span class="cardno">Card ${c.no} / ${DECK.length}</span></div>
      <div class="block"><div class="label">Scenario</div><p>${esc(c.scenario)}</p></div>
      <div class="block response"><div class="label">What they said &mdash; one element is wrong or missing!</div><p>${esc(c.response)}</p></div>
      <div class="action-box"><div class="label">Action &mdash; do this before answering</div><p>${esc(c.action)}</p></div>
      <div class="block" style="text-align:center; color:#8a5fb8; font-weight:700; font-size:.9rem;">
        Then place your answer face down: Observation, Feelings, Needs or Request?</div>`;
    back.innerHTML = `
      <div class="badge-row"><span class="badge a">Reveal</span><span class="cardno">Card ${c.no}</span></div>
      <div class="answer-big"><div class="label" style="color:#2e7d46">The element that is ${c.kind.toLowerCase()}:</div>
        <div class="elem">${esc(c.answer)}</div><div class="kind">${esc(c.kind)}</div></div>
      <div class="fix-box"><div class="label">Why &amp; the corrected version</div><p>${esc(c.fix)}</p></div>
      <div class="reward-box">&#127942; ${esc(c.reward)}</div>`;
    document.getElementById('btnTimer').style.display = c.secs ? '' : 'none';
    document.getElementById('btnReveal').style.display = '';
  } else {
    front.className = 'face front challenge';
    front.innerHTML = `
      <div class="badge-row"><span class="badge c">Challenge for Growth</span><span class="cardno">Card ${c.no} / ${DECK.length}</span></div>
      <div class="challenge-big">&#127793; Challenge for Growth! &#127793;</div>
      <div class="meta"><span class="chip">&#9200; ${esc(c.timer)}</span>${c.reward ? `<span class="chip">&#127942; Reward: ${esc(c.reward)}</span>` : ''}${c.penalty ? `<span class="chip penalty">&#9888; Penalty: ${esc(c.penalty)}</span>` : ''}</div>
      <div class="action-box"><div class="label">Your challenge</div><p class="challenge-text">${esc(c.action)}</p></div>
      <div class="timer-area"><div class="timer-display" id="tdisp">${c.secs ? c.secs : ''}</div></div>`;
    back.innerHTML = `
      <div class="badge-row"><span class="badge c">Challenge for Growth</span><span class="cardno">Card ${c.no}</span></div>
      <div class="answer-big"><div class="elem" style="color:#c07b00">No question this time!</div></div>
      ${c.reward ? `<div class="reward-box">Did they do it? &#127942; Reward: ${esc(c.reward)}</div>` : ''}
      ${c.penalty ? `<div class="penalty-box">&#9888; Penalty: ${esc(c.penalty)}</div>` : ''}`;
    document.getElementById('btnTimer').style.display = c.secs ? '' : 'none';
    document.getElementById('btnReveal').style.display = c.secs || !c.q ? '' : '';
  }
  // shared timer display for question challenge-less cards is hidden via button
  document.getElementById('counter').textContent =
    `Card ${pos+1} of ${DECK.length} this round • deck reshuffles when finished`;
}

document.getElementById('btnNext').onclick = () => {
  pos++;
  if(pos >= order.length){ newRound(); pos = 0; }
  render();
};

document.getElementById('btnReveal').onclick = () => {
  document.getElementById('card').classList.toggle('flipped');
};

document.getElementById('btnTimer').onclick = () => {
  const c = DECK[order[pos]];
  if(!c.secs) return;
  stopTimer();
  remaining = c.secs;
  let disp = document.getElementById('tdisp');
  if(!disp){ // question cards: create a floating display inside the action box
    const box = document.querySelector('.action-box');
    disp = document.createElement('div');
    disp.className = 'timer-display'; disp.id = 'tdisp';
    box.appendChild(disp);
  }
  disp.textContent = remaining; disp.classList.remove('done');
  ticking = setInterval(() => {
    remaining--;
    disp.textContent = remaining;
    if(remaining <= 0){
      stopTimer();
      disp.textContent = "TIME'S UP!";
      disp.classList.add('done');
      beep(3);
    }
  }, 1000);
};

newRound();
document.getElementById('btnNext').click();
</script>
